[package]
name = "djames"
version = "1.0.0"
edition = "2021"
rust-version = "1.70"
description = "D-James and James: ultra-short multivariate signatures (ePrint 2026/1650)"
license = "MIT OR Apache-2.0"
categories = ["cryptography", "no-std"]

# No dependencies, deliberately: the crate is portable to any target with a
# 64-bit integer type and needs no platform-specific code.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
